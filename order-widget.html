<!-- =====================================================================
  PAPPI ORDER WIDGET — paste this whole block into index.html where you
  want the order form (e.g. replace your current "Direct order" form).
  1) Fill in the 3 settings in PAPPI_CONFIG below.
  2) Upload your Maya QR Ph image to /assets/qr/qrph.png in your GitHub repo.
====================================================================== -->
<div id="pappi-order" class="pw" aria-live="polite"></div>

<style>
  .pw{--pw-bg:#0c0b09;--pw-panel:#16140f;--pw-line:#2d2819;--pw-gold:#c9a45c;--pw-gold-hi:#e3c585;--pw-text:#f3ede0;--pw-mute:#a39a86;--pw-err:#ff8a7a;
      font-family:inherit;color:var(--pw-text);background:var(--pw-bg);border:1px solid var(--pw-line);border-radius:18px;padding:clamp(18px,4vw,32px);max-width:760px;margin:0 auto;box-sizing:border-box}
  .pw *{box-sizing:border-box}
  .pw h3{font-size:1.35rem;margin:0 0 4px;font-weight:600;letter-spacing:.01em}
  .pw p{margin:0;color:var(--pw-mute);line-height:1.55}
  .pw .pw-steps{display:flex;gap:6px;margin:0 0 22px}
  .pw .pw-steps span{flex:1;height:3px;border-radius:3px;background:var(--pw-line)}
  .pw .pw-steps span.on{background:var(--pw-gold)}
  .pw .pw-seg{display:inline-flex;border:1px solid var(--pw-line);border-radius:999px;padding:3px;margin:18px 0 14px}
  .pw .pw-seg button{border:0;background:none;color:var(--pw-mute);padding:8px 16px;border-radius:999px;font:inherit;cursor:pointer}
  .pw .pw-seg button[aria-pressed="true"]{background:var(--pw-gold);color:#1a1409;font-weight:600}
  .pw .pw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
  .pw .pw-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1px solid var(--pw-line);border-radius:12px;background:var(--pw-panel)}
  .pw .pw-item.has{border-color:var(--pw-gold)}
  .pw .pw-item b{display:block;font-weight:600}
  .pw .pw-item small{color:var(--pw-mute)}
  .pw .pw-qty{display:flex;align-items:center;gap:8px}
  .pw .pw-qty button{width:32px;height:32px;border-radius:50%;border:1px solid var(--pw-line);background:transparent;color:var(--pw-text);font-size:1.1rem;cursor:pointer;line-height:1}
  .pw .pw-qty button:hover{border-color:var(--pw-gold)}
  .pw .pw-qty output{min-width:1ch;text-align:center}
  .pw .pw-group{margin-top:22px;color:var(--pw-mute);font-size:.95rem}
  .pw label{display:block;margin:14px 0 6px;font-size:.95rem}
  .pw input,.pw textarea,.pw select{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--pw-line);background:var(--pw-panel);color:var(--pw-text);font:inherit}
  .pw textarea{min-height:84px;resize:vertical}
  .pw input:focus,.pw textarea:focus,.pw button:focus-visible{outline:2px solid var(--pw-gold);outline-offset:2px}
  .pw .pw-radio{display:grid;gap:8px}
  .pw .pw-radio label{display:flex;gap:10px;align-items:flex-start;margin:0;padding:12px 14px;border:1px solid var(--pw-line);border-radius:10px;background:var(--pw-panel);cursor:pointer}
  .pw .pw-radio input{width:auto;margin-top:4px;accent-color:var(--pw-gold)}
  .pw .pw-radio label:has(input:checked){border-color:var(--pw-gold)}
  .pw .pw-radio small{display:block;color:var(--pw-mute)}
  .pw .pw-bar{position:sticky;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px;padding-top:16px;border-top:1px solid var(--pw-line);background:var(--pw-bg)}
  .pw .pw-total{font-size:1.15rem}
  .pw .pw-total small{display:block;color:var(--pw-mute);font-size:.8rem}
  .pw .pw-btn{border:0;border-radius:999px;padding:13px 24px;background:var(--pw-gold);color:#1a1409;font:inherit;font-weight:700;cursor:pointer}
  .pw .pw-btn:hover{background:var(--pw-gold-hi)}
  .pw .pw-btn[disabled]{opacity:.45;cursor:not-allowed}
  .pw .pw-link{background:none;border:0;color:var(--pw-mute);font:inherit;cursor:pointer;text-decoration:underline;padding:0}
  .pw .pw-methods{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:14px}
  .pw .pw-methods button{padding:12px;border-radius:10px;border:1px solid var(--pw-line);background:var(--pw-panel);color:var(--pw-text);font:inherit;cursor:pointer}
  .pw .pw-methods button[aria-pressed="true"]{border-color:var(--pw-gold);color:var(--pw-gold-hi)}
  .pw .pw-qr{display:grid;grid-template-columns:minmax(0,220px) 1fr;gap:20px;align-items:center;margin-top:18px;padding:16px;border:1px solid var(--pw-line);border-radius:14px;background:var(--pw-panel)}
  .pw .pw-qr img{width:100%;border-radius:10px;background:#fff}
  .pw .pw-noqr{grid-template-columns:1fr}
  .pw .pw-num{font-size:1.8rem;font-weight:700;letter-spacing:.04em;color:var(--pw-text)}
  .pw .pw-amount{font-size:2rem;font-weight:700;color:var(--pw-gold-hi);margin:4px 0}
  .pw .pw-drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:120px;margin-top:8px;border:1.5px dashed var(--pw-line);border-radius:12px;cursor:pointer;text-align:center;padding:16px}
  .pw .pw-drop.ok{border-color:var(--pw-gold);border-style:solid}
  .pw .pw-drop img{max-height:160px;border-radius:8px}
  .pw .pw-err{color:var(--pw-err);margin-top:12px;min-height:1.2em}
  .pw .pw-summary{margin:14px 0 0;padding:0;list-style:none;border-top:1px solid var(--pw-line)}
  .pw .pw-summary li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--pw-line)}
  .pw .pw-done{text-align:center;padding:12px 0}
  .pw .pw-done .pw-no{font-size:2.2rem;font-weight:700;color:var(--pw-gold-hi);margin:10px 0}
  @media (max-width:560px){.pw .pw-qr{grid-template-columns:1fr}.pw .pw-qr img{max-width:260px;margin:0 auto;display:block}}
  @media (prefers-reduced-motion:no-preference){.pw .pw-view{animation:pw-in .25s ease-out}@keyframes pw-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(() => {
  // ------------------------- SETTINGS -------------------------
  const PAPPI_CONFIG = {
    SUPABASE_URL: "https://bkklvfioefrdaddbcisz.supabase.co",
    SUPABASE_ANON_KEY: "sb_publishable_sXZa6c917YXzSkvKdhzaig_FgrdDbjQ",
    PAYMENT: {                              // how customers can pay
      "QR Ph": { qr: "/assets/qr/qrph.png",  hint: "Scan with any bank or e-wallet app: GCash, Maya, BPI, MariBank and more." },
      "GCash": { number: "0905 561 3013",    hint: "Send to this GCash number using Send Money." },
    },
    ACCOUNT_NAME: "Vergilio G.",            // shown under the QR so buyers know it's you
  };
  // ------------------------------------------------------------

  const root = document.getElementById("pappi-order");
  const db = window.supabase.createClient(PAPPI_CONFIG.SUPABASE_URL, PAPPI_CONFIG.SUPABASE_ANON_KEY);
  const peso = n => "₱" + Number(n).toLocaleString("en-PH");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

  const state = {
    step: 1, products: [], line: "Elixir 40%", cart: {},
    name: "", phone: "", delivery: "nationwide", address: "", note: "",
    method: "QR Ph", file: null, preview: "", busy: false, error: "", done: null,
  };

  const subtotal = () => Object.entries(state.cart).reduce((s,[id,q]) => {
    const p = state.products.find(x => x.id === id); return s + (p ? p.price * q : 0); }, 0);
  const count = () => Object.values(state.cart).reduce((a,b) => a + b, 0);
  const steps = n => `<div class="pw-steps" aria-hidden="true">${[1,2,3].map(i => `<span class="${i<=n?"on":""}"></span>`).join("")}</div>`;

  function bar(label, enabled, back) {
    return `<div class="pw-bar">
      <div class="pw-total">${count() ? peso(subtotal()) : "₱0"}<small>${count()} item${count()===1?"":"s"}${back ? ` · <button class="pw-link" data-back>Back</button>` : ""}</small></div>
      <button class="pw-btn" data-next ${enabled ? "" : "disabled"}>${label}</button></div>`;
  }

  function viewPick() {
    const lines = [...new Set(state.products.filter(p => p.line !== "Savon").map(p => p.line))];
    const scents = state.products.filter(p => p.line === state.line);
    const savon = state.products.filter(p => p.line === "Savon");
    const item = p => { const q = state.cart[p.id] || 0; return `
      <div class="pw-item ${q ? "has" : ""}">
        <div><b>${esc(p.name)}</b><small>${peso(p.price)}</small></div>
        <div class="pw-qty">
          <button data-dec="${p.id}" aria-label="Remove one ${esc(p.name)}">−</button>
          <output>${q}</output>
          <button data-inc="${p.id}" aria-label="Add one ${esc(p.name)}">+</button>
        </div></div>`; };
    return `${steps(1)}
      <h3>Choose your scents</h3>
      <p>Elixir 40% lasts longer with fewer touch-ups. Parfum 20% is lighter for everyday wear. Both are 50 ml.</p>
      <div class="pw-seg" role="group" aria-label="Strength">
        ${lines.map(l => `<button data-line="${esc(l)}" aria-pressed="${l===state.line}">${esc(l)}</button>`).join("")}
      </div>
      <div class="pw-grid">${scents.map(item).join("")}</div>
      ${savon.length ? `<div class="pw-group">Pappi Savon</div><div class="pw-grid" style="margin-top:10px">${savon.map(item).join("")}</div>` : ""}
      ${bar("Continue to delivery", count() > 0)}`;
  }

  function viewDetails() {
    const needsAddr = state.delivery !== "pickup";
    const opt = (v, t, s) => `<label><input type="radio" name="pw-del" value="${v}" ${state.delivery===v?"checked":""}><span>${t}<small>${s}</small></span></label>`;
    return `${steps(2)}
      <h3>Where should we send it?</h3>
      <label for="pw-name">Full name</label>
      <input id="pw-name" autocomplete="name" value="${esc(state.name)}">
      <label for="pw-phone">Mobile number</label>
      <input id="pw-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="09XX XXX XXXX" value="${esc(state.phone)}">
      <label>Delivery</label>
      <div class="pw-radio">
        ${opt("nationwide","Nationwide delivery","Ships next day, arrives in about 3–5 days")}
        ${opt("cebu_express","Cebu City express","About 1–2 hours by Maxim, Grab or Angkas. Rider fee is paid on delivery.")}
        ${opt("pickup","Pickup","We'll text you the pickup time")}
      </div>
      ${needsAddr ? `<label for="pw-addr">Complete address</label>
      <textarea id="pw-addr" autocomplete="street-address" placeholder="House no., street, barangay, city, province, landmark">${esc(state.address)}</textarea>` : ""}
      <label for="pw-note">Note (optional)</label>
      <input id="pw-note" placeholder="Gift message, preferred time, etc." value="${esc(state.note)}">
      <p class="pw-err" role="alert">${esc(state.error)}</p>
      ${bar("Continue to payment", true, true)}`;
  }

  function viewPay() {
    const pay = PAPPI_CONFIG.PAYMENT[state.method];
    const items = Object.entries(state.cart).map(([id,q]) => { const p = state.products.find(x => x.id===id);
      return `<li><span>${q} × ${esc(p.name)} <small style="color:var(--pw-mute)">${esc(p.line)}</small></span><span>${peso(p.price*q)}</span></li>`; }).join("");
    return `${steps(3)}
      <h3>Pay and send your screenshot</h3>
      <p>Pay by QR Ph or GCash, then upload your payment screenshot.</p>
      <div class="pw-methods" role="group" aria-label="Payment method">
        ${Object.keys(PAPPI_CONFIG.PAYMENT).map(m => `<button data-method="${esc(m)}" aria-pressed="${m===state.method}">${esc(m)}</button>`).join("")}
      </div>
      <div class="pw-qr ${pay.qr ? "" : "pw-noqr"}">
        ${pay.qr ? `<img src="${esc(pay.qr)}" alt="QR Ph code for Pappi Suds & Scents">` : `<div class="pw-num">${esc(pay.number)}</div>`}
        <div>
          <p>Send exactly</p>
          <div class="pw-amount">${peso(subtotal())}</div>
          <p>to ${esc(PAPPI_CONFIG.ACCOUNT_NAME)}. ${esc(pay.hint)}</p>
          ${pay.qr ? `<p style="margin-top:8px">On mobile, screenshot the QR, then upload it in your app's Scan QR screen.</p>` : `<p style="margin-top:8px"><button class="pw-link" data-copy="${esc(pay.number.replace(/\s/g,""))}">Copy number</button></p>`}
          ${state.delivery === "nationwide" ? `<p style="margin-top:8px">We'll text you the shipping fee to settle before dispatch.</p>` : ""}
        </div>
      </div>
      <ul class="pw-summary">${items}</ul>
      <label for="pw-file">Payment screenshot</label>
      <label class="pw-drop ${state.file ? "ok" : ""}" for="pw-file">
        ${state.preview ? `<img src="${state.preview}" alt="Your payment screenshot">` : ""}
        <span>${state.file ? "Screenshot added. Tap to change." : "Tap to upload your screenshot"}</span>
      </label>
      <input id="pw-file" type="file" accept="image/*" hidden>
      <p class="pw-err" role="alert">${esc(state.error)}</p>
      ${bar(state.busy ? "Placing order…" : "Place order", !!state.file && !state.busy, true)}`;
  }

  function viewDone() {
    return `<div class="pw-done pw-view">
      <h3>Order received. Salamat!</h3>
      <div class="pw-no">${esc(state.done.order_no)}</div>
      <p>We'll check your payment and text ${esc(state.phone)} once your order is confirmed. Keep your order number for follow-ups.</p>
      <p style="margin-top:18px"><button class="pw-link" data-again>Place another order</button></p></div>`;
  }

  function render() {
    if (!state.products.length) { root.innerHTML = `<p>Loading scents…</p>`; return; }
    const html = state.done ? viewDone() : state.step === 1 ? viewPick() : state.step === 2 ? viewDetails() : viewPay();
    root.innerHTML = `<div class="pw-view">${html}</div>`;
  }

  function saveInputs() {
    const v = id => root.querySelector("#" + id)?.value;
    if (root.querySelector("#pw-name")) state.name = v("pw-name").trim();
    if (root.querySelector("#pw-phone")) state.phone = v("pw-phone").trim();
    if (root.querySelector("#pw-addr")) state.address = v("pw-addr").trim();
    if (root.querySelector("#pw-note")) state.note = v("pw-note").trim();
  }

  function validateDetails() {
    if (state.name.length < 2) return "Enter your full name.";
    if (state.phone.replace(/\D/g,"").length < 10) return "Enter a mobile number we can text, like 0917 123 4567.";
    if (state.delivery !== "pickup" && state.address.length < 8) return "Enter your complete delivery address.";
    return "";
  }

  // Shrink big phone screenshots so uploads are fast (keeps under the 5 MB limit)
  async function compress(file) {
    try {
      const img = await createImageBitmap(file);
      const scale = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      return await new Promise(r => c.toBlob(b => r(b), "image/jpeg", 0.85));
    } catch { return file; }
  }

  async function placeOrder() {
    state.busy = true; state.error = ""; render();
    try {
      const blob = await compress(state.file);
      if (blob.size > 5 * 1024 * 1024) throw new Error("That screenshot is over 5 MB. Take a new screenshot and try again.");
      const ext = blob.type === "image/jpeg" ? "jpg" : (blob.type.split("/")[1] || "jpg");
      const now = new Date();
      const path = `proofs/${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}/${crypto.randomUUID()}.${ext}`;
      const up = await db.storage.from("payment-proofs").upload(path, blob, { contentType: blob.type || "image/jpeg" });
      if (up.error) throw new Error("Your screenshot didn't upload. Check your connection and try again.");

      const { data, error } = await db.rpc("place_order", {
        p_name: state.name, p_phone: state.phone,
        p_address: state.delivery === "pickup" ? null : state.address,
        p_delivery: state.delivery, p_payment_method: state.method,
        p_proof_path: path, p_note: state.note,
        p_items: Object.entries(state.cart).map(([product_id, qty]) => ({ product_id, qty })),
      });
      if (error) throw new Error(error.message);
      state.done = data[0];
      db.functions.invoke("notify-telegram", { body: { order_id: state.done.order_id } }).catch(() => {});
    } catch (e) {
      state.error = e.message || "Your order didn't go through. Try again, or text us at 0905 561 3013.";
    }
    state.busy = false; render();
  }

  root.addEventListener("click", e => {
    const t = e.target.closest("button"); if (!t) return;
    const d = t.dataset;
    if (d.line) { state.line = d.line; }
    else if (d.inc) { state.cart[d.inc] = Math.min(50, (state.cart[d.inc] || 0) + 1); }
    else if (d.dec) { const q = (state.cart[d.dec] || 0) - 1; if (q <= 0) delete state.cart[d.dec]; else state.cart[d.dec] = q; }
    else if (d.method) { state.method = d.method; }
    else if (d.copy) { navigator.clipboard?.writeText(d.copy); t.textContent = "Copied"; return; }
    else if ("back" in d) { saveInputs(); state.error = ""; state.step--; }
    else if ("again" in d) { Object.assign(state, { step: 1, cart: {}, file: null, preview: "", done: null, note: "" }); }
    else if ("next" in d) {
      saveInputs();
      if (state.step === 2) { state.error = validateDetails(); if (state.error) return render(); }
      if (state.step === 3) return placeOrder();
      state.error = ""; state.step++;
      root.scrollIntoView({ behavior: "smooth", block: "start" });
    } else return;
    render();
  });

  root.addEventListener("change", e => {
    if (e.target.name === "pw-del") { saveInputs(); state.delivery = e.target.value; render(); }
    if (e.target.id === "pw-file" && e.target.files[0]) {
      state.file = e.target.files[0];
      state.preview = URL.createObjectURL(state.file);
      state.error = ""; render();
    }
  });

  (async () => {
    render();
    const { data, error } = await db.from("products").select("id,line,name,price").eq("active", true).order("sort");
    if (error || !data?.length) { root.innerHTML = `<p>Ordering is offline right now. Text us at 0905 561 3013 or order on Shopee.</p>`; return; }
    state.products = data; render();
  })();
})();
</script>
