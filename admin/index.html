<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0c0b09">
<title>Pappi Orders</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0c0b09;--panel:#16140f;--panel2:#1d1a13;--line:#2d2819;--gold:#c9a45c;--gold-hi:#e3c585;--text:#f3ede0;--mute:#a39a86;--new:#e3c585;--paid:#7fc8a9;--packed:#8fb3e8;--shipped:#b89ae8;--done:#6f6a5c;--cancel:#ff8a7a}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 "Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  h1,h2,.brand,.stat .v{font-family:"Noto Serif",Georgia,serif}
  body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
  .top{display:flex;align-items:center;justify-content:space-between;max-width:1100px;margin:0 auto;padding:14px 16px}
  .brand{font-weight:700;letter-spacing:.02em}.brand span{color:var(--gold)}
  nav{display:flex;gap:4px;max-width:1100px;margin:0 auto;padding:0 12px 10px;overflow-x:auto}
  nav button{border:0;background:none;padding:8px 14px;border-radius:999px;color:var(--mute);white-space:nowrap}
  nav button[aria-current="page"]{background:var(--gold);color:#1a1409;font-weight:600}
  main{max-width:1100px;margin:0 auto;padding:16px}
  .muted{color:var(--mute)}
  .btn{border:0;border-radius:999px;padding:10px 18px;background:var(--gold);color:#1a1409;font-weight:700}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:500}
  .btn:disabled{opacity:.5}
  input,select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
  .filters{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}
  .chip{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 12px;white-space:nowrap;color:var(--mute)}
  .chip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold-hi)}
  .chip b{color:var(--text);margin-left:4px}
  .list{display:grid;gap:8px}
  .row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;text-align:left;width:100%}
  .row:hover{border-color:var(--gold)}
  .dot{width:10px;height:10px;border-radius:50%}
  .s-new{background:var(--new)}.s-awaiting_payment{background:transparent;border:2px solid var(--mute)}.s-paid{background:var(--paid)}.s-packed{background:var(--packed)}.s-shipped{background:var(--shipped)}.s-completed{background:var(--done)}.s-cancelled{background:var(--cancel)}
  .row small{display:block;color:var(--mute)}
  .amt{font-weight:700;text-align:right}
  .sheet{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.6);display:flex;justify-content:flex-end}
  .sheet>div{width:min(560px,100%);height:100%;overflow:auto;background:var(--panel2);border-left:1px solid var(--line);padding:20px 18px calc(24px + env(safe-area-inset-bottom))}
  .sheet h2{margin:0 0 2px;font-size:1.4rem}
  .kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;margin:16px 0}
  .kv dt{color:var(--mute)}.kv dd{margin:0;word-break:break-word}
  .proof{width:100%;border-radius:10px;border:1px solid var(--line);background:#000;margin-top:6px}
  .pipeline{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:16px 0}
  .pipeline button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 4px;font-size:.9rem}
  .pipeline button[aria-pressed="true"]{border-color:var(--gold);background:var(--gold);color:#1a1409;font-weight:700}
  .items{list-style:none;margin:0;padding:0}.items li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
  .field{margin-top:12px}.field label{display:block;color:var(--mute);margin-bottom:4px;font-size:.9rem}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:18px}
  .stat{padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
  .stat .v{font-size:1.6rem;font-weight:700}
  .stat .l{color:var(--mute);font-size:.9rem}
  .stat.hl{border-color:var(--gold)}
  .sheet.wide>div{width:min(860px,100%)}
  .tag.st-paid{color:var(--paid);border-color:var(--paid);font-weight:700} .tag.st-partial{color:var(--packed);border-color:var(--packed);font-weight:700} .tag.st-unpaid{color:var(--new);border-color:var(--new);font-weight:700} .tag.st-overdue{color:#fff;background:var(--cancel);border-color:var(--cancel);font-weight:700}
  .stat.hl .v{color:var(--gold-hi)}
  .mbars{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;height:180px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:18px}
  .mbar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0}
  .mbar div{width:100%;background:var(--gold);border-radius:4px 4px 0 0;min-height:2px}
  .mv{font-size:.68rem;color:var(--gold-hi);white-space:nowrap}
  .ml{font-size:.72rem;color:var(--mute)}
  .bars{display:flex;align-items:flex-end;gap:3px;height:140px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:18px}
  .bars div{flex:1;background:var(--gold);border-radius:3px 3px 0 0;min-height:2px}
  table{width:100%;border-collapse:collapse}
  th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--mute);font-weight:500}
  td.n,th.n{text-align:right}
  .wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px 8px}
  .login{max-width:360px;margin:12vh auto;padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:16px}
  .login h1{margin:0 0 4px;font-size:1.4rem}
  .login .field{margin-top:14px}
  .err{color:var(--cancel);min-height:1.3em;margin-top:10px}
  .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--gold);color:#1a1409;padding:10px 18px;border-radius:999px;font-weight:600;z-index:20}
  h3{margin:22px 0 10px;font-size:1.05rem}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
  .items-edit{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
  .item-row,.item-head{display:grid;grid-template-columns:1fr 64px 96px 40px;gap:6px;align-items:center}
  .item-head{font-size:.78rem}
  .item-row .btn{padding:8px 0}
  .tag{display:inline-block;margin-left:6px;padding:1px 8px;border:1px solid var(--line);border-radius:999px;color:var(--gold-hi);font-size:.72rem;vertical-align:1px}
  .card-set{padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:8px}
  .linkbtn{border:0;background:none;padding:0;color:var(--gold-hi);text-decoration:underline;cursor:pointer}
  @media (max-width:560px){.grid2{grid-template-columns:1fr}.item-row,.item-head{grid-template-columns:1fr 54px 78px 36px}}
  @media (max-width:560px){.row{grid-template-columns:auto 1fr}.row .amt{grid-column:2;text-align:left}.kv{grid-template-columns:90px 1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ------------------------- SETTINGS (same as the order widget) -------------------------
const SUPABASE_URL = "https://bkklvfioefrdaddbcisz.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_sXZa6c917YXzSkvKdhzaig_FgrdDbjQ";
// ---------------------------------------------------------------------------------------

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const app = document.getElementById("app");
const peso = n => "₱" + Number(n || 0).toLocaleString("en-PH");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fmtDate = d => new Date(d).toLocaleString("en-PH", { month:"short", day:"numeric", hour:"numeric", minute:"2-digit" });
const STATUSES = ["new","awaiting_payment","paid","packed","shipped","completed","cancelled"];
const SITE = "https://pappiscents.shop";
const LABEL = { new:"To check", awaiting_payment:"Unpaid", paid:"Paid", packed:"Packed", shipped:"Shipped", completed:"Completed", cancelled:"Cancelled" };
const DELIVERY = { nationwide:"Nationwide", cebu_express:"Cebu express", pickup:"Pickup" };
const REVENUE_STATUSES = ["paid","packed","shipped","completed"];
const CHANNELS = { website:"Website", distributor:"Distributor", zoho:"Zoho import", manual:"Manual", messenger:"Messenger", facebook:"Facebook", instagram:"Instagram", tiktok:"TikTok", "walk-in":"Walk-in", reseller:"Reseller", shopee:"Shopee", other:"Other" };
const PAYMENTS = ["QR Ph","GCash","Maya","Bank transfer","Cash","COD","Other"];
const realPhone = ph => ph && !/^(zoho|shopee):/.test(String(ph));
const peso2 = n => "₱" + Number(n || 0).toLocaleString("en-PH", { maximumFractionDigits: 2 });

const S = { tab:"orders", filter:"new", orders:[], customers:[], products:[], settings:{ shipping_fee:80, free_shipping_over:1500 }, open:null, edit:null, dist:null, distForm:null, payments:[], moves:[], proofUrl:"", q:"" };

function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.append(t); setTimeout(()=>t.remove(),2200); }

// ---------------- Auth ----------------
function viewLogin(err=""){
  app.innerHTML = `<form class="login" id="login">
    <h1>Pappi Orders</h1><p class="muted">Sign in to manage orders.</p>
    <div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="username" required></div>
    <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <p class="err">${esc(err)}</p>
    <button class="btn" style="width:100%">Sign in</button></form>`;
  document.getElementById("login").onsubmit = async e => {
    e.preventDefault();
    const { error } = await db.auth.signInWithPassword({ email: em.value.trim(), password: pw.value });
    if (error) return viewLogin("Wrong email or password.");
    boot();
  };
}

// ---------------- Data ----------------
async function load(){
  const since = new Date(Date.now() - 1000*60*60*24*365).toISOString();
  const [o, c, p, st, pay, mv] = await Promise.all([
    db.from("orders").select("*, customers(id,name,phone,address), order_items(product_id,name,line,qty,unit_price)").gte("created_at", since).order("created_at",{ascending:false}),
    db.from("customers").select("*").order("created_at",{ascending:false}),
    db.from("products").select("*").order("sort"),
    db.from("shop_settings").select("*").eq("id",1).maybeSingle(),
    db.from("payments").select("*").order("paid_on",{ascending:false}),
    db.from("stock_moves").select("*").order("moved_on",{ascending:false}),
  ]);
  if (o.error) throw o.error;
  S.orders = o.data; S.customers = c.data || []; S.products = p.data || [];
  S.settings = st.data || { shipping_fee: 80, free_shipping_over: 1500 };
  S.payments = pay.data || []; S.moves = mv.data || [];
}

// ---------------- Views ----------------
function shell(body){
  const tabs = [["orders","Orders"],["distributors","Distributors"],["customers","Customers"],["sales","Sales"],["products","Products"]];
  app.innerHTML = `<header><div class="top"><div class="brand">Pappi <span>Orders</span></div>
      <div><button class="btn ghost" id="refresh">Refresh</button> <button class="btn ghost" id="logout">Sign out</button></div></div>
    <nav>${tabs.map(([k,l])=>`<button data-tab="${k}" ${S.tab===k?'aria-current="page"':""}>${l}</button>`).join("")}</nav></header>
    <main>${body}</main>${S.edit ? viewEditor() : S.distForm ? viewDistForm() : S.dist ? viewDistributor() : S.open ? viewOrder() : ""}`;
}

function viewOrders(){
  const counts = Object.fromEntries(STATUSES.map(s=>[s, S.orders.filter(o=>o.status===s).length]));
  const list = S.orders.filter(o => S.filter==="all" || o.status===S.filter);
  return `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px"><h3 style="margin:0">Orders</h3><button class="btn" data-neworder>+ New order</button></div>
    <div class="filters">${["new","awaiting_payment","paid","packed","shipped","completed","cancelled","all"].map(f=>
      `<button class="chip" data-filter="${f}" aria-pressed="${S.filter===f}">${f==="all"?"All":LABEL[f]}<b>${f==="all"?S.orders.length:counts[f]}</b></button>`).join("")}</div>
    <div class="list">${list.length ? list.map(o=>`
      <button class="row" data-order="${o.id}">
        <span class="dot s-${o.status}" title="${LABEL[o.status]}"></span>
        <span><b>${esc(o.order_no)}</b> · ${esc(o.customers?.name)}${o.channel && o.channel!=="website" ? ` <span class="tag">${esc(CHANNELS[o.channel] || o.channel)}</span>` : ""}
          <small>${o.order_items.map(i=>`${i.qty}× ${esc(i.name)} ${i.line.split(" ")[0]}`).join(", ")} · ${DELIVERY[o.delivery]} · ${fmtDate(o.created_at)}</small></span>
        <span class="amt">${peso(o.total)}<small>${o.channel==="shopee" && Number(o.platform_fees) ? `net ${peso2(o.total - o.platform_fees)}` : esc(o.payment_method || "Not paid yet")}</small></span>
      </button>`).join("") : `<p class="muted">No ${S.filter==="all"?"":LABEL[S.filter].toLowerCase()+" "}orders. Paid website orders appear under To check and on Telegram.</p>`}</div>`;
}

function viewOrder(){
  const o = S.orders.find(x=>x.id===S.open); if(!o) return "";
  const pipe = ["paid","packed","shipped","completed"];
  const repeat = S.orders.filter(x=>x.customer_id===o.customer_id).length;
  return `<div class="sheet" data-close><div role="dialog" aria-label="Order ${esc(o.order_no)}">
    <div style="display:flex;justify-content:space-between;align-items:start">
      <div><h2>${esc(o.order_no)}</h2><span class="muted">${fmtDate(o.created_at)} · ${LABEL[o.status]}</span></div>
      <button class="btn ghost" data-close>Close</button></div>
    <div class="pipeline">${pipe.map(s=>`<button data-status="${s}" aria-pressed="${o.status===s}">${LABEL[s]}</button>`).join("")}</div>
    <ul class="items">${o.order_items.map(i=>`<li><span>${i.qty} × ${esc(i.name)} <span class="muted">${esc(i.line)}</span></span><span>${peso(i.qty*i.unit_price)}</span></li>`).join("")}
      <li><span>Shipping</span><span>${peso(o.shipping_fee)}</span></li>
      ${Number(o.discount)?`<li><span>Discount</span><span>− ${peso2(o.discount)}</span></li>`:""}
      <li><b>Total</b><b>${peso2(o.total)}</b></li>
      ${Number(o.platform_fees)?`<li><span>Shopee fees</span><span>− ${peso2(o.platform_fees)}</span></li><li><b>You receive</b><b style="color:var(--gold-hi)">${peso2(o.payout_amount ?? (o.total - o.platform_fees))}</b></li>`:""}</ul>
    <dl class="kv">
      <dt>Customer</dt><dd>${esc(o.customers?.name)}${repeat>1?` <span style="color:var(--gold-hi)">· ${repeat} orders</span>`:""}</dd>
      <dt>Mobile</dt><dd>${realPhone(o.customers?.phone) ? `<a style="color:var(--gold-hi)" href="tel:${esc(o.customers?.phone)}">${esc(o.customers?.phone)}</a> · <a style="color:var(--gold-hi)" href="sms:${esc(o.customers?.phone)}">Text</a>` : `<span class="muted">No number yet — tap Edit order to add it</span>`}</dd>
      <dt>Delivery</dt><dd>${DELIVERY[o.delivery]}</dd>
      ${o.address?`<dt>Address</dt><dd>${esc(o.address)}${o.address_parts ? `<br><button class="btn ghost" style="padding:6px 12px;margin-top:6px" data-jnt="${o.id}">Copy for J&amp;T</button>` : ""}</dd>`:""}
      <dt>Payment</dt><dd>${o.channel==="shopee" ? "Paid through Shopee" : esc(o.payment_method || "—")} · ${o.status === "awaiting_payment" ? "not paid yet" : o.status === "new" ? "should be" : o.status === "cancelled" ? "cancelled" : "paid"} ${peso2(o.total)}</dd>
      ${o.channel === "shopee" ? `<dt>Shopee order</dt><dd>${esc(o.external_ref||"—")}${o.payout_date?` · paid out ${esc(o.payout_date)}`:""}${o.platform_fee_details?`<br><span class="muted" style="font-size:.85rem">${Object.entries(o.platform_fee_details).filter(([k,v])=>typeof v==="number").map(([k,v])=>`${esc(k)} ${peso2(Math.abs(v))}`).join(" · ")}</span>`:""}</dd>` : ""}
      ${o.channel === "zoho" ? `<dt>Source</dt><dd>Imported from Zoho</dd>` : o.channel === "shopee" ? "" : `<dt>Order link</dt><dd><button class="btn ghost" style="padding:6px 12px" data-copylink="${esc(SITE + "/?checkout=" + o.access_token)}">Copy link</button> <span class="muted" style="font-size:.85rem">Send it if they need to finish paying or track the order.</span></dd>`}
      ${o.customer_note?`<dt>Their note</dt><dd>${esc(o.customer_note)}</dd>`:""}
    </dl>
    <div class="muted">Payment screenshot</div>
    ${S.proofUrl?`<a href="${S.proofUrl}" target="_blank" rel="noopener"><img class="proof" src="${S.proofUrl}" alt="Payment screenshot for ${esc(o.order_no)}"></a>`:`<p class="muted">${o.proof_path?"Loading…":"No screenshot"}</p>`}
    <div class="field"><label for="f-ship">Delivery fee (₱) <span class="muted" style="font-size:.8rem">· overrides the flat rate for this order</span></label><input id="f-ship" type="number" min="0" step="1" value="${Number(o.shipping_fee)}"></div>
    <div class="field"><label for="f-track">Tracking number</label><input id="f-track" value="${esc(o.tracking_no)}"></div>
    <div class="field"><label for="f-note">Private note</label><textarea id="f-note" rows="2">${esc(o.admin_note)}</textarea></div>
    <div class="actions"><button class="btn" data-save>Save details</button>
      ${o.channel==="distributor" ? `<button class="btn ghost" data-dist="${o.customer_id}">Open distributor</button> <button class="btn ghost" data-printreceipt="${o.id}">Print receipt</button>` : `<button class="btn ghost" data-editorder="${o.id}">Edit order</button>`}
      ${o.status!=="cancelled"?`<button class="btn ghost" data-status="cancelled">Cancel order</button>`:`<button class="btn ghost" data-status="new">Reopen order</button>`}</div>
  </div></div>`;
}

function customerStats(){
  const by = {};
  for (const o of S.orders){
    if (!REVENUE_STATUSES.includes(o.status) && o.status!=="new") continue;
    const c = by[o.customer_id] ||= { orders:0, spent:0, last:null, scents:{} };
    c.orders++; if (REVENUE_STATUSES.includes(o.status)) c.spent += Number(o.total);
    if (!c.last || o.created_at > c.last) c.last = o.created_at;
    for (const i of o.order_items) c.scents[i.name] = (c.scents[i.name]||0) + i.qty;
  }
  return by;
}

function viewCustomers(){
  const st = customerStats(); const q = S.q.toLowerCase();
  const rows = S.customers.filter(c=>!q || c.name.toLowerCase().includes(q) || c.phone.includes(q))
    .map(c=>({ ...c, ...(st[c.id]||{orders:0,spent:0,last:null,scents:{}}) }))
    .sort((a,b)=>b.spent-a.spent);
  const fav = s => Object.entries(s).sort((a,b)=>b[1]-a[1])[0]?.[0] || "—";
  const repeaters = rows.filter(r=>r.orders>1).length;
  return `<div class="stats">
      <div class="stat"><div class="v">${S.customers.length}</div><div class="l">Customers</div></div>
      <div class="stat"><div class="v">${repeaters}</div><div class="l">Repeat buyers</div></div>
      <div class="stat"><div class="v">${S.customers.length?Math.round(repeaters/S.customers.length*100):0}%</div><div class="l">Repeat rate</div></div></div>
    <input id="q" placeholder="Search name or number" value="${esc(S.q)}" style="margin-bottom:12px">
    <div class="wrap"><table><thead><tr><th>Name</th><th>Mobile</th><th class="n">Orders</th><th class="n">Spent</th><th>Favorite</th><th>Last order</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${realPhone(r.phone) ? `<a style="color:var(--gold-hi)" href="sms:${esc(r.phone)}">${esc(r.phone)}</a>` : `<span class="muted">—</span>`}</td>
      <td class="n">${r.orders}</td><td class="n">${peso(r.spent)}</td><td>${esc(fav(r.scents))}</td><td>${r.last?fmtDate(r.last):"—"}</td></tr>`).join("") || `<tr><td colspan="6" class="muted">Customers are added automatically when they order.</td></tr>`}</tbody></table></div>`;
}

function viewSales(){
  const paid = S.orders.filter(o=>REVENUE_STATUSES.includes(o.status));
  const when = o => new Date(o.paid_at||o.created_at);
  const now = new Date();
  const startOfMonth = (y,m) => new Date(y, m, 1);
  const P = {
    month: { label:"This month", from: startOfMonth(now.getFullYear(), now.getMonth()), to: null },
    last:  { label:"Last month", from: startOfMonth(now.getFullYear(), now.getMonth()-1), to: startOfMonth(now.getFullYear(), now.getMonth()) },
    d90:   { label:"Last 90 days", from: new Date(now - 90*864e5), to: null },
    all:   { label:"All time", from: new Date(0), to: null },
  };
  const per = P[S.period] || P.month;
  const inPer = o => when(o) >= per.from && (!per.to || when(o) < per.to);
  const list = paid.filter(inPer);
  const items = arr => arr.reduce((s,o)=>s+Number(o.subtotal)-Number(o.discount||0),0);
  const deliv = arr => arr.reduce((s,o)=>s+Number(o.shipping_fee||0),0);
  const gross = arr => arr.reduce((s,o)=>s+Number(o.total),0);
  const fees  = arr => arr.reduce((s,o)=>s+Number(o.platform_fees||0),0);
  const net   = arr => gross(arr) - fees(arr);
  const units = {}; let elixir=0, parfum=0, savon=0, unknown=0;
  for (const o of list) for (const i of o.order_items){
    const k = i.name + " · " + i.line; units[k] = units[k] || { name:i.name, line:i.line, qty:0, rev:0 };
    units[k].qty += i.qty; units[k].rev += i.qty*i.unit_price;
    if (i.line.startsWith("Elixir")) elixir+=i.qty; else if (i.line.startsWith("Parfum")) parfum+=i.qty; else if (i.line==="Savon") savon+=i.qty; else unknown+=i.qty;
  }
  const bottles = elixir + parfum;
  const chan = {}; for (const o of list){ const k = o.channel==="shopee" ? "Shopee" : o.channel==="distributor" ? "Distributors" : "Direct (website, Zoho, manual)"; (chan[k] ||= []).push(o); }
  // Monthly bars (last 12 months)
  const months = [...Array(12)].map((_,k)=>{ const d=new Date(now.getFullYear(), now.getMonth()-11+k, 1); return d; });
  const perMonth = months.map(m=>net(paid.filter(o=>{const d=when(o); return d.getFullYear()===m.getFullYear() && d.getMonth()===m.getMonth();})));
  const maxM = Math.max(1,...perMonth);
  const mLabel = d => d.toLocaleString("en-PH",{month:"short"});
  const waiting = S.orders.filter(o=>o.status==="new").length;
  const toShip = S.orders.filter(o=>o.status==="paid"||o.status==="packed").length;
  const unpaid = S.orders.filter(o=>o.status==="awaiting_payment");
  return `<div class="filters">${Object.entries(P).map(([k,v])=>`<button class="chip" data-period="${k}" aria-pressed="${(S.period||"month")===k}">${v.label}</button>`).join("")}</div>
    <div class="stats">
      <div class="stat"><div class="v">${peso(gross(list))}</div><div class="l">Gross sales · items ${peso(items(list))} + delivery ${peso(deliv(list))}</div></div>
      <div class="stat"><div class="v">− ${peso2(fees(list))}</div><div class="l">Platform fees (Shopee)</div></div>
      <div class="stat hl"><div class="v">${peso2(net(list))}</div><div class="l">Net income after fees</div></div>
      <div class="stat"><div class="v">${list.length}</div><div class="l">Paid orders · avg ${list.length?peso(Math.round(gross(list)/list.length)):"₱0"}</div></div>
      <div class="stat"><div class="v">${bottles}</div><div class="l">Bottles · ${elixir} Elixir / ${parfum} Parfum${unknown?` · ${unknown} Shopee item${unknown===1?"":"s"} to label`:""}</div></div>
      <div class="stat"><div class="v">${waiting} / ${toShip}</div><div class="l">To check / to ship now</div></div>
    </div>
    ${(()=>{ const owed = distributorsList().reduce((a,x)=>a+Math.max(0,x.balance),0); return owed ? `<p class="muted" style="margin:-6px 0 8px">Distributors still owe <b style="color:var(--gold-hi)">${peso2(owed)}</b> — see the Distributors tab.</p>` : ""; })()}
    ${unpaid.length?`<p class="muted" style="margin:-6px 0 14px">${unpaid.length} unpaid checkout${unpaid.length===1?"":"s"} worth ${peso(gross(unpaid))} — see Orders › Unpaid.</p>`:""}
    <h3>Monthly net income, last 12 months</h3>
    <div class="mbars" role="img" aria-label="Monthly net income">${perMonth.map((v,k)=>`<div class="mbar"><span class="mv">${v?peso(Math.round(v/100)/10+"").replace("₱","₱")+"k":""}</span><div style="height:${v/maxM*100}%" title="${mLabel(months[k])} ${months[k].getFullYear()}: ${peso(v)}"></div><span class="ml">${mLabel(months[k])}</span></div>`).join("")}</div>
    <h3>Best sellers · ${per.label.toLowerCase()}</h3>
    <div class="wrap"><table><thead><tr><th>Scent</th><th>Line</th><th class="n">Units</th><th class="n">Sales</th></tr></thead>
    <tbody>${Object.values(units).sort((a,b)=>b.qty-a.qty||b.rev-a.rev).map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.line)}</td><td class="n">${u.qty}</td><td class="n">${peso(u.rev)}</td></tr>`).join("") || `<tr><td colspan="4" class="muted">No paid orders in this period.</td></tr>`}</tbody></table></div>
    <h3>Where sales came from</h3>
    <div class="wrap"><table><thead><tr><th>Channel</th><th class="n">Orders</th><th class="n">Items</th><th class="n">Delivery</th><th class="n">Platform fees</th><th class="n">Net income</th></tr></thead>
    <tbody>${Object.entries(chan).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${v.length}</td><td class="n">${peso(items(v))}</td><td class="n">${peso(deliv(v))}</td><td class="n">${fees(v)?"− "+peso2(fees(v)):"—"}</td><td class="n"><b>${peso2(net(v))}</b></td></tr>`).join("") || `<tr><td colspan="6" class="muted">No paid orders in this period.</td></tr>`}</tbody></table></div>
    <p class="muted" style="margin-top:10px">Gross = items (after discounts) + delivery fees you charged. Shopee orders use the figures from Shopee's income report; Shopee covers their shipping, and its fees are shown separately. Net = what you keep.</p>`;
}

function fillFromCustomer(phone){
  const d = S.edit.draft, c = S.customers.find(x=>x.phone===phone.replace(/\D/g,"")); if(!c) return false;
  if (!d.name) d.name = c.name;
  const last = S.orders.find(o=>o.customer_id===c.id && o.address_parts);
  if (last && !d.address_parts.street) d.address_parts = { province:"", city:"", barangay:"", street:"", landmark:"", zip:"", ...last.address_parts };
  else if (!last && c.address && !d.address_parts.street) d.address_parts.street = c.address;
  return true;
}
async function saveDraft(){
  const E = S.edit, d = E.draft;
  d.items = d.items.filter(i=>i.product_id);
  const orig = E.id ? S.orders.find(x=>x.id===E.id) : null;
  if (!d.phone && orig && !realPhone(orig.customers?.phone)) d.phone = orig.customers.phone;   // Zoho customer without a number yet
  const payload = { ...d, items: d.items.map(i=>({ product_id:i.product_id, qty:Number(i.qty)||1, unit_price:Number(i.unit_price)||0 })) };
  delete payload.shipAuto;
  E.busy = true; E.error = ""; render();
  if (E.receipt) { payload.customer_id = E.receipt.id; }
  const { data, error } = E.receipt
    ? await db.rpc("admin_save_receipt", { p_order_id: E.id, p: payload })
    : await db.rpc("admin_save_order", { p_order_id: E.id, p: payload });
  E.busy = false;
  if (error) { E.error = error.message; if (!d.items.length) d.items.push({ product_id:"", qty:1, unit_price:0 }); return render(); }
  const row = data[0]; const wasNew = !E.id;
  if (E.receipt) { S.edit = null; await load(); S.dist = E.receipt.id; render(); toast(wasNew ? `Receipt ${row.order_no} created` : `Receipt ${row.order_no} saved`); return; }
  S.edit = null; await load(); S.open = row.order_id; S.proofUrl = ""; render();
  toast(wasNew ? `Order ${row.order_no} created` : `Order ${row.order_no} updated`);
}

const SHOP = { name:"Pappi Suds & Scents Shop", addr:["20 Mancono Street, La Paloma Subd","Cebu City, Cebu 6000, Philippines"], phone:"+63 905 561 3013", email:"pappi.artisan@gmail.com",
  pay:"GCash 0905 561 3013 · Vergilio Jr Gamotan · QR Ph available on request" };
const today = () => new Date(Date.now() + 8*3600e3).toISOString().slice(0,10);   // Manila date
const fmtD = d => d ? new Date(d.length===10 ? d+"T12:00:00+08:00" : d).toLocaleDateString("en-PH",{ year:"numeric", month:"short", day:"numeric" }) : "—";
const ymd = d => new Date(new Date(d).getTime() + 8*3600e3).toISOString().slice(0,10);
function distPrice(dist, prod){ const pr = dist.distributor_prices || {}; const v = pr[prod.line]; return v != null && v !== "" ? Number(v) : Number(prod.price); }

function receiptsOf(cid){ return S.orders.filter(o=>o.customer_id===cid && o.channel==="distributor" && o.status!=="cancelled").sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)); }
function paidOn(oid){ return S.payments.filter(p=>p.order_id===oid).reduce((a,p)=>a+Number(p.amount),0); }
function receiptState(o){
  const paid = paidOn(o.id), bal = Number(o.total) - paid;
  const overdue = bal > 0.005 && o.due_date && o.due_date < today();
  return { paid, bal, label: bal <= 0.005 ? "Paid" : overdue ? "Overdue" : paid > 0 ? "Partial" : "Unpaid", overdue };
}
function stockOf(cid){
  const map = {};
  const row = pid => map[pid] ||= { product: S.products.find(p=>p.id===pid) || { id:pid, name:pid, line:"" }, delivered:0, consumed:0, returned:0, adjust:0 };
  for (const o of receiptsOf(cid)) for (const i of o.order_items) row(i.product_id).delivered += i.qty;
  for (const m of S.moves.filter(m=>m.customer_id===cid)) { const r = row(m.product_id); if (m.kind==="consumed") r.consumed += m.qty; else if (m.kind==="returned") r.returned += m.qty; else r.adjust += m.qty; }
  return Object.values(map).map(r=>({ ...r, onhand: r.delivered - r.consumed - r.returned + r.adjust })).sort((a,b)=>(a.product.sort??99)-(b.product.sort??99));
}
function distributorsList(){
  return S.customers.filter(c=>c.is_distributor).map(c=>{
    const rs = receiptsOf(c.id), billed = rs.reduce((a,o)=>a+Number(o.total),0);
    const paid = S.payments.filter(p=>p.customer_id===c.id).reduce((a,p)=>a+Number(p.amount),0);
    const overdue = rs.map(receiptState).filter(x=>x.overdue).reduce((a,x)=>a+x.bal,0);
    const st = stockOf(c.id);
    return { ...c, receipts: rs, billed, paid, balance: billed - paid, overdue, onhand: st.reduce((a,r)=>a+r.onhand,0), consumed: st.reduce((a,r)=>a+r.consumed,0),
             last: rs.length ? rs[rs.length-1].created_at : null };
  }).sort((a,b)=>b.balance-a.balance);
}
const stateTag = l => `<span class="tag st-${l.toLowerCase()}">${l}</span>`;

async function saveDistForm(){
  const F = S.distForm, d = F.draft; F.error = ""; let res;
  F.busy = true; render();
  if (F.type==="distributor") {
    const prices = {}; if (d.elixir!=="") prices["Elixir 40%"]=Number(d.elixir); if (d.parfum!=="") prices["Parfum 20%"]=Number(d.parfum); if (d.savon!=="") prices["Savon"]=Number(d.savon);
    res = await db.rpc("admin_save_distributor", { p: { id:d.id||null, name:d.name, phone:d.phone, address:d.address, credit_days:d.credit_days, prices, notes:d.notes } });
    if (!res.error) { await load(); S.distForm = null; S.dist = res.data; render(); return toast("Distributor saved"); }
  } else if (F.type==="payment") {
    res = await db.rpc("admin_record_payment", { p_customer_id:d.customer_id, p_amount:Number(d.amount), p_paid_on:d.paid_on||null, p_method:d.method, p_reference:d.reference||null, p_note:d.note||null, p_order_id:d.order_id||null });
    if (!res.error) { await load(); S.distForm = null; render(); return toast(`Payment of ${peso2(d.amount)} recorded`); }
  } else {
    const rows = d.lines.filter(l=>l.product_id && Number(l.qty)).map(l=>({ customer_id:d.customer_id, product_id:l.product_id, kind:d.kind, qty:Math.round(Number(l.qty)), moved_on:d.moved_on||today(), note:d.note||null }));
    if (!rows.length) res = { error:{ message:"Add at least one product with a quantity." } };
    else if (d.kind!=="adjustment" && rows.some(r=>r.qty<0)) res = { error:{ message:"Use positive quantities. For corrections, choose Stock count adjustment." } };
    else res = await db.from("stock_moves").insert(rows);
    if (!res.error) { await load(); S.distForm = null; render(); return toast("Consumption recorded"); }
  }
  F.busy = false; F.error = res.error.message; render();
}

  const inner = shopHead("Statement of Account", `As of <b>${fmtD(today())}</b>`) + `
    <div class="two"><div class="box"><h4>Distributor</h4><b>${esc(x.name)}</b><br>${realPhone(x.phone)?esc(x.phone)+"<br>":""}${esc(x.address||"")}</div>
      <div class="box" style="text-align:right"><h4>Balance</h4><b style="font-size:18px;color:#94722c">${x.balance>=0?peso2(x.balance):"Credit "+peso2(-x.balance)}</b>${x.overdue?`<br><span style="color:#b3261e">Overdue ${peso2(x.overdue)}</span>`:""}</div></div>
    <table><thead><tr><th>Date</th><th>Details</th><th class="n">Charges</th><th class="n">Payments</th><th class="n">Balance</th></tr></thead><tbody>${rows || `<tr><td colspan="5">No activity yet.</td></tr>`}</tbody></table>
    <table class="tot"><tr><td>Total billed</td><td class="n">${peso2(x.billed)}</td></tr><tr><td>Total paid</td><td class="n">− ${peso2(x.paid)}</td></tr><tr class="bal"><td>${x.balance>=0?"Balance due":"Credit"}</td><td class="n">${peso2(Math.abs(x.balance))}</td></tr></table>
    ${st.length?`<h4 style="margin:22px 0 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#94722c">Stock summary</h4>
    <table><thead><tr><th>Product</th><th class="n">Delivered</th><th class="n">Consumed</th><th class="n">Returned</th><th class="n">On hand</th></tr></thead><tbody>
    ${st.map(r=>`<tr><td>${esc(r.product.name)} · ${esc(r.product.line||"")}</td><td class="n">${r.delivered}</td><td class="n">${r.consumed}</td><td class="n">${r.returned}</td><td class="n"><b>${r.onhand}</b></td></tr>`).join("")}</tbody></table>`:""}
    <div class="note"><b>Payment:</b> ${SHOP.pay}.</div>
    <div class="foot">Thank you for growing Pappi with us.</div>`;
  printDoc(`Statement ${x.name}`, inner);
}

// ---------------- Actions ----------------
async function openOrder(id){
  S.open = id; S.proofUrl = ""; render();
  const o = S.orders.find(x=>x.id===id);
  if (o?.proof_path){
    const { data } = await db.storage.from("payment-proofs").createSignedUrl(o.proof_path, 600);
    if (S.open===id){ S.proofUrl = data?.signedUrl || ""; render(); }
  }
}

async function updateOrder(id, patch, msg){
  const { data, error } = await db.from("orders").update(patch).eq("id", id)
    .select("*, customers(id,name,phone,address), order_items(product_id,name,line,qty,unit_price)").single();
  if (error) return toast("Didn't save: " + error.message);
  S.orders = S.orders.map(o=>o.id===id?data:o); render(); toast(msg);
}

app.addEventListener("click", async e => {
  if (e.target.matches(".sheet[data-close]")) { if (S.edit || S.distForm) return; if (S.dist) { S.dist=null; return render(); } S.open=null; return render(); }
  const b = e.target.closest("button"); if(!b) return;
  const d = b.dataset;
  if (d.tab){ S.tab=d.tab; S.open=null; S.edit=null; S.dist=null; S.distForm=null; render(); }
  else if ("neworder" in d){ S.open=null; openEditor(null); }
  else if (d.dist){ S.open=null; S.dist=d.dist; render(); }
  else if ("distclose" in d){ S.dist=null; render(); }
  else if ("newdist" in d){ openDistForm("distributor"); }
  else if (d.editdist){ openDistForm("distributor", { id:d.editdist }); }
  else if (d.paydist){ openDistForm("payment", { id:d.paydist, order:d.payorder||"" }); }
  else if (d.consume){ openDistForm("consumption", { id:d.consume }); }
  else if ("canceldistform" in d){ S.distForm=null; render(); }
  else if ("savedistform" in d){ saveDistForm(); }
  else if ("addmoveline" in d){ S.distForm.draft.lines.push({ product_id:"", qty:1 }); render(); }
  else if (d.delmoveline){ S.distForm.draft.lines.splice(Number(d.delmoveline),1); if(!S.distForm.draft.lines.length) S.distForm.draft.lines.push({ product_id:"", qty:1 }); render(); }
  else if (d.newreceipt){ openReceiptEditor(d.newreceipt, null); }
  else if (d.editreceipt){ const o = S.orders.find(z=>z.id===d.editreceipt); openReceiptEditor(o.customer_id, o.id); }
  else if (d.printreceipt){ printReceipt(d.printreceipt); }
  else if (d.printstatement){ printStatement(d.printstatement); }
  else if (d.delpay){ if (!confirm("Delete this payment? The balance will go back up.")) return; const { error } = await db.from("payments").delete().eq("id", d.delpay); if (error) return toast("Didn't delete: "+error.message); await load(); render(); toast("Payment deleted"); }
  else if (d.delmove){ if (!confirm("Delete this entry?")) return; const { error } = await db.from("stock_moves").delete().eq("id", d.delmove); if (error) return toast("Didn't delete: "+error.message); await load(); render(); toast("Entry deleted"); }
  else if (d.editorder){ openEditor(d.editorder); }
  else if ("canceledit" in d){ S.edit=null; render(); }
  else if ("additem" in d){ S.edit.draft.items.push({ product_id:"", qty:1, unit_price:0 }); render(); }
  else if (d.delitem){ S.edit.draft.items.splice(Number(d.delitem),1); syncShip(S.edit.draft); render(); }
  else if ("shipauto" in d){ S.edit.draft.shipAuto=true; syncShip(S.edit.draft); render(); }
  else if ("saveorder" in d){ saveDraft(); }
  else if ("savesettings" in d){
    const shipping_fee = Number(document.getElementById("set-ship").value), free_shipping_over = Number(document.getElementById("set-free").value);
    if (!(shipping_fee >= 0) || !(free_shipping_over >= 0)) return toast("Enter valid amounts");
    const { error } = await db.from("shop_settings").update({ shipping_fee, free_shipping_over, updated_at:new Date().toISOString() }).eq("id",1);
    if (error) return toast("Didn't save: " + error.message);
    S.settings = { ...S.settings, shipping_fee, free_shipping_over }; toast("Shipping saved. Website updated");
  }
  else if (d.filter){ S.filter=d.filter; render(); }
  else if (d.period){ S.period=d.period; render(); }
  else if (d.jnt){
    const o = S.orders.find(x=>x.id===d.jnt); const a = o.address_parts || {};
    const text = [`Receiver: ${o.customers?.name}`, `Phone: ${o.customers?.phone}`, `Province: ${a.province||""}`, `City/Municipality: ${a.city||""}`,
      `Barangay: ${a.barangay||""}`, `Address: ${a.street||""}${a.landmark?` (Landmark: ${a.landmark})`:""}`, a.zip?`ZIP: ${a.zip}`:"",
      `Item: ${o.order_items.map(i=>`${i.qty}x ${i.name} ${i.line}`).join(", ")}`, `Order: ${o.order_no}`].filter(Boolean).join("\n");
    navigator.clipboard?.writeText(text); toast("Copied in J&T format");
  }
  else if (d.copylink){ navigator.clipboard?.writeText(d.copylink); toast("Order link copied"); }
  else if (d.order){ openOrder(d.order); }
  else if ("close" in d){ S.open=null; render(); }
  else if (d.status){ await updateOrder(S.open, { status:d.status }, `Marked ${LABEL[d.status]}`); }
  else if ("save" in d){
    await updateOrder(S.open, { shipping_fee:Number(document.getElementById("f-ship").value)||0,
      tracking_no:document.getElementById("f-track").value.trim()||null, admin_note:document.getElementById("f-note").value.trim()||null }, "Details saved");
  }
  else if (d.saveprod){
    const price = Number(app.querySelector(`[data-price="${d.saveprod}"]`).value);
    const active = app.querySelector(`[data-active="${d.saveprod}"]`).checked;
    if (active && !(price > 0)) return toast("Set a price above ₱0 before putting it on sale");
    const { error } = await db.from("products").update({ price, active }).eq("id", d.saveprod);
    if (error) return toast("Didn't save: " + error.message);
    S.products = S.products.map(p=>p.id===d.saveprod?{...p,price,active}:p); toast("Product saved");
  }
  else if (b.id==="refresh"){ await load(); render(); toast("Up to date"); }
  else if (b.id==="logout"){ await db.auth.signOut(); viewLogin(); }
});
app.addEventListener("input", e => {
  const t = e.target;
  if (S.distForm && t.dataset.df && t.dataset.df!=="convert") { S.distForm.draft[t.dataset.df] = t.value; return; }
  if (S.distForm && t.dataset.ml) { const l = S.distForm.draft.lines[Number(t.dataset.ml)]; l[t.dataset.mk] = t.dataset.mk==="qty" ? t.value : t.value; return; }
  if (S.edit && t.dataset.f) {
    const d = S.edit.draft, k = t.dataset.f;
    if (k.startsWith("a.")) d.address_parts[k.slice(2)] = t.value;
    else if (k === "shipping_fee") { d.shipping_fee = Number(t.value)||0; d.shipAuto = false; }
    else if (k === "discount") { d.discount = Math.max(0, Number(t.value)||0); }
    else d[k] = t.value;
    if (k === "phone" && fillFromCustomer(t.value)) { render(); const el=document.querySelector('[data-f="phone"]'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); return; }
    if (k === "delivery") syncShip(d);
    refreshTotals(); return;
  }
  if (S.edit && t.dataset.item) {
    const it = S.edit.draft.items[Number(t.dataset.item)], k = t.dataset.k;
    it[k] = k === "product_id" ? t.value : Number(t.value);
    refreshTotals(); return;
  }
});
app.addEventListener("change", e => {
  const t = e.target;
  if (S.distForm && t.dataset.df === "convert") {
    const c = S.customers.find(z=>z.id===t.value), d = S.distForm.draft;
    if (c) Object.assign(d, { id:c.id, name:c.name, phone:realPhone(c.phone)?c.phone:"", address:c.address||"" }); else Object.assign(d, { id:"", name:"", phone:"", address:"" });
    render(); return;
  }
  if (S.distForm && (t.dataset.df || t.dataset.ml)) { if (t.dataset.df) S.distForm.draft[t.dataset.df] = t.value; else S.distForm.draft.lines[Number(t.dataset.ml)][t.dataset.mk] = t.value; return; }
  if (S.edit && t.dataset.item && t.dataset.k === "product_id") {
    const it = S.edit.draft.items[Number(t.dataset.item)], p = S.products.find(x=>x.id===t.value);
    it.product_id = t.value; if (p) it.unit_price = S.edit.receipt ? distPrice(S.edit.receipt, p) : Number(p.price); syncShip(S.edit.draft); render();
  } else if (S.edit && (t.dataset.f === "delivery" || t.dataset.f === "status" || t.dataset.f === "payment_method" || t.dataset.f === "channel")) {
    S.edit.draft[t.dataset.f] = t.value; syncShip(S.edit.draft); refreshTotals();
  }
});
app.addEventListener("input", e => { if (e.target.id==="q"){ S.q=e.target.value; const pos=e.target.selectionStart; render(); const q=document.getElementById("q"); q.focus(); q.setSelectionRange(pos,pos);} });

// New orders show up live while the dashboard is open
function live(){
  db.channel("orders").on("postgres_changes", { event:"*", schema:"public", table:"orders" }, async (ev) => {
    await load(); render();
    if (ev.eventType === "UPDATE" && ev.new?.status === "new") toast("Payment received — check it");
    else if (ev.eventType === "INSERT") toast("New checkout started");
  }).subscribe();
}

async function boot(){
  const { data:{ session } } = await db.auth.getSession();
  if (!session) return viewLogin();
  try { await load(); } catch(e){ await db.auth.signOut(); return viewLogin("This account can't view orders. Sign in with the admin email."); }
  render(); live();
}
boot();
</script>
